name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Only actions/checkout is used (same constraint as the dsh web3 stack: some
# org Actions policies do not resolve marketplace setup-* actions). Node and
# corepack ship on ubuntu-latest; pnpm comes from corepack and the lockfile
# pins everything.
jobs:
  packages:
    name: board-core + dsh-board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm --version

      - name: Install (packages only)
        # The web app needs the haven-aol checkout; the packages do not.
        run: pnpm install --frozen-lockfile --filter './packages/*' --filter fairhaven-workspace

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm -r --filter './packages/*' --if-present run typecheck

      - name: Build
        run: pnpm -r --filter './packages/*' run build

      - name: Fixture integrity
        # The two fixture files are the cross-client contract; fail loud if
        # anyone edits them without touching the spec that pins them.
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('packages/board-core/tests/fixtures/board-order-vectors.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('packages/board-core/tests/fixtures/board-payload-vectors.json','utf8'))"
          echo "fixtures parse"

  web:
    name: web (static export)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Haven-AOL SDK
        # Same approach as haven-dapp: the TS SDK is not on npm, so the app
        # aliases a checkout at apps/web/haven-aol.
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Haven-hvn/haven-aol.git apps/web/haven-aol

      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Haven-AOL SDK
        working-directory: apps/web/haven-aol/packages/typescript
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build --if-present

      - name: Test web
        # Web specs need web-only deps, so they are excluded from the root
        # suite the packages job runs; run them here after the full install.
        run: npx vitest run --config apps/web/vitest.config.ts

      - name: Build board-core
        run: pnpm --filter @fairhaven/board-core run build

      - name: Type check web
        working-directory: apps/web
        run: pnpm run type-check

      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_ARKIV_RPC_URL: ${{ vars.NEXT_PUBLIC_ARKIV_RPC_URL || 'https://rpc.tiramisu.db-chain.testnet.arkiv.network' }}
          NEXT_PUBLIC_HAVEN_AOL_CANISTER_ID: ${{ vars.NEXT_PUBLIC_HAVEN_AOL_CANISTER_ID || 'gny6k-fqaaa-aaaab-ag3ra-cai' }}
          NEXT_PUBLIC_EIP712_CHAIN_ID: ${{ vars.NEXT_PUBLIC_EIP712_CHAIN_ID || '1' }}
          NEXT_PUBLIC_EIP712_VERIFYING_CONTRACT: ${{ vars.NEXT_PUBLIC_EIP712_VERIFYING_CONTRACT || '0x0000000000000000000000000000000000000000' }}
        run: pnpm run build

      - name: Verify static export
        working-directory: apps/web
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/board.html || test -f out/board/index.html
          test -f out/icon.svg || test -f out/mark.svg
          du -sh out
